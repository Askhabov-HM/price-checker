plugins { id 'com.android.application' }

// Keep the downloaded client configuration outside Git. FirebaseInitProvider reads
// the same resources normally produced by the Google services plugin.
def firebaseFile = rootProject.file('../../.secrets/lamoda/google-services.json')
def firebaseValues = [:]
if (firebaseFile.exists()) {
    try {
        def config = new groovy.json.JsonSlurper().parse(firebaseFile)
        def client = config.client.find { it.client_info.android_client_info.package_name == 'ru.pricechecker.lamoda' }
        firebaseValues = [google_app_id: client.client_info.mobilesdk_app_id,
            gcm_defaultSenderId: config.project_info.project_number,
            google_api_key: client.api_key[0].current_key, project_id: config.project_info.project_id]
        if (firebaseValues.values().any { !(it instanceof String) || !it.matches('[A-Za-z0-9_:\\-]+') }) throw new Exception()
    } catch (Exception ignored) { throw new GradleException('Invalid private Firebase config for ru.pricechecker.lamoda') }
}
android {
    namespace 'ru.pricechecker.lamoda'
    compileSdk 36
    defaultConfig {
        applicationId 'ru.pricechecker.lamoda'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseValues.isEmpty() ? 'false' : 'true'
        resValue 'string', 'project_id', firebaseValues.project_id ?: ''
        firebaseValues.findAll { name, value -> name != 'project_id' }.each { name, value -> resValue 'string', name, value }
        buildConfigField 'String', 'DEFAULT_SERVER', '"https://153.76.171.172"'
        // Public certificate fingerprint, not a credential. Normal CA validation is used for other servers.
        buildConfigField 'String', 'SERVER_CERT_SHA256', '"f85d05a12cc431f20a1c5d6f3c4300bf48b965953e6351c875bf09e98917d00f"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
}
