# Installed as jail.d/99-price-checker-sshd.local by scripts/setup-fail2ban.sh.
[sshd]
enabled = true
backend = systemd
filter = sshd[mode=normal]
port = 22
protocol = tcp
banaction = iptables-multiport
usedns = no
ignoreself = true
ignoreip = 127.0.0.1/8 ::1
findtime = 10m
maxretry = 5
bantime = 1h
